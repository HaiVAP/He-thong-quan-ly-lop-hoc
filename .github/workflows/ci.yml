name: EduHub CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-build:
    name: Build & Verify .NET 8 Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/EduHub.Api/EduHub.Api.csproj

      - name: Build Backend (Release)
        run: dotnet build backend/EduHub.Api/EduHub.Api.csproj --configuration Release --no-restore

  frontend-build:
    name: Build & Verify React Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      - name: TypeScript Check & Vite Build
        working-directory: ./frontend
        run: npm run build

  docker-verify:
    name: Verify Docker Container Build
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Backend Docker Image
        run: docker build -t eduhub-api:test ./backend

      - name: Build Frontend Docker Image
        run: docker build -t eduhub-frontend:test ./frontend

