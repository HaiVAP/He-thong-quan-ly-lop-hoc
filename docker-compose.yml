services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eduhub
      POSTGRES_USER: eduhub
      POSTGRES_PASSWORD: eduhub_dev_password
    ports: ["5432:5432"]
    volumes: [eduhub_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduhub -d eduhub"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=eduhub;Username=eduhub;Password=eduhub_dev_password
      Jwt__Secret: CHANGE_THIS_DEVELOPMENT_SECRET_TO_A_LONG_RANDOM_VALUE_123456
      Jwt__Issuer: EduHub
      Jwt__Audience: EduHubClient
      Cors__Frontend: http://localhost:5173
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]
volumes:
  eduhub_pgdata:
